{% extends "base/base.html" %}
{% load static %}

{% block title %}
    Register | Glow Salon
{% endblock %}

{% block content %}
<section class="section container">
    <div class="auth-card">
        <div class="section-heading">
            <p class="eyebrow">
                Join Glow Salon
            </p>

            <h1>
                Create an account
            </h1>
        </div>

        <form id="register-form"
              class="auth-form">

            {% csrf_token %}

            <div class="form-group">
                <label for="register-username">
                    Username
                </label>

                <input id="register-username"
                       type="text"
                       required>
            </div>

            <div class="form-group">
                <label for="register-email">
                    Email
                </label>

                <input id="register-email"
                       type="email"
                       required>
            </div>

            <div class="form-group">
                <label for="register-password">
                    Password
                </label>

                <input id="register-password"
                       type="password"
                       minlength="8"
                       required>
            </div>

            <button type="submit"
                    class="btn btn-primary">
                Create account
            </button>

            <p id="register-message"
               class="form-message"
               role="alert"></p>
        </form>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/register.js' %}"></script>
{% endblock %}
