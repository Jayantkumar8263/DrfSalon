{% extends "base/base.html" %}
{% load static %}

{% block title %}
    Login 
{% endblock %}

{% block content %}
<section class="section container">
    <div class="auth-card">
        <div class="section-heading">
            <p class="eyebrow">
                Welcome back
            </p>

            <h1>
                Login to your account
            </h1>

            <p>
                Login to book and manage your appointments.
            </p>
        </div>

        <form id="login-form"
              class="auth-form"
              novalidate>

            {% csrf_token %}

            <div class="form-group">
                <label for="username">
                    Username
                </label>

                <input id="username"
                       name="username"
                       type="text"
                       autocomplete="username"
                       required>

                <small id="username-error"
                       class="field-error"></small>
            </div>

            <div class="form-group">
                <label for="password">
                    Password
                </label>

                <input id="password"
                       name="password"
                       type="password"
                       autocomplete="current-password"
                       required>

                <small id="password-error"
                       class="field-error"></small>
            </div>

            <button id="login-submit"
                    type="submit"
                    class="btn btn-primary">
                Login
            </button>

            <p id="login-message"
               class="form-message"
               role="alert"></p>
        </form>

        <p class="auth-footer">
            Do not have an account?
            <a href="{% url 'register-page' %}">Register</a>
        </p>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/login.js' %}"></script>
{% endblock %}
