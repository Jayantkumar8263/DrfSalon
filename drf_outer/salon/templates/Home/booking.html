{% extends "base/base.html" %}
{% load static %}

{% block title %}
    Book an Appointment | Glow Salon
{% endblock %}

{% block content %}
<section class="section container">
    <div class="section-heading">
        <p class="eyebrow">
            Book your visit
        </p>

        <h1>
            Make an appointment
        </h1>

        <p>
            Choose your service, staff member,
            date, and available time.
        </p>
    </div>

    <form id="booking-form"
          class="booking-form">

        <div class="form-group">
            <label for="service">
                Service
            </label>

            <select id="service"
                    name="service"
                    required>
                <option value="">
                    Loading services...
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="staff">
                Staff member
            </label>

            <select id="staff"
                    name="staff"
                    required>
                <option value="">
                    Loading staff...
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="appointment-date">
                Date
            </label>

            <input
                id="appointment-date"
                name="appointment_date"
                type="date"
                required
            >
        </div>

        <div class="form-group">
            <label for="appointment-time">
                Available time
            </label>

            <select id="appointment-time"
                    name="appointment_time"
                    required>
                <option value="">
                    Select staff and date first
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="notes">
                Notes
            </label>

            <textarea
                id="notes"
                name="notes"
                rows="4"
                placeholder="Any special request?"
            ></textarea>
        </div>

        <div id="booking-message"
             class="form-message">
        </div>

        <button
            type="submit"
            class="btn btn-primary"
            id="booking-submit"
        >
            Book appointment
        </button>
    </form>
</section>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/booking.js' %}"></script>
{% endblock %}
